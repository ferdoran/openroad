[workspace]
resolver = "2" # Important! wgpu/Bevy needs this!

members = [
    "client",
    "sro_macro",
    "sro_macro_derive",
    "packets",
    "tools",
    "bevy_pk2"
, "launcher"]

[workspace.package]
version = "0.1.5"
edition = "2021"
authors = ["The OpenRoad Authors"]
repository = "https://github.com/ferdoran/openroad"
# Every crate is GPL-3.0-or-later, so a closed fork cannot take this work
# without giving its changes back. See LICENSE.
#
# The library crates were briefly marked `MIT OR Apache-2.0`; that is reverted.
# They carry commits from several contributors who wrote them under GPL, so
# relicensing them is not the repo owner's call alone.
license = "GPL-3.0-or-later"

[workspace.dependencies]
bevy = { version = "0.19", features = ["dds", "serialize", "file_watcher", "wav", "bevy_animation"] }
bytes = "1.3.0"
byteorder = "1.4.3"
thiserror = "1"
futures = "0.3"
anyhow = "1"


# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Release exists to do the one thing the dev profile above cannot: dev already builds
# every dependency at opt-level 3, so the only optimization left to buy is cross-crate
# inlining — which cargo's default `lto = false` switches off. Thin LTO turns it back on.
# See docs/perf-future-levers.md §0 for the measurement and for the levers from Bevy's
# setup guide deliberately NOT taken (dynamic_linking would break the release zip).
#
# `codegen-units = 1` is the other half of Bevy's recommendation and is deliberately NOT
# taken here, on measurement rather than taste: at cgu=1 a `--release` build of `client`
# peaks at 7.42 GB in a SINGLE rustc process (14m19s, measured 2026-09-03). That figure
# is one process, so unlike a parallel build's peak it does not shrink on a smaller
# machine — and build-macos.yml runs on macos-latest, which has 3 cores and 7 GB. It
# would OOM. Thin LTO is also designed to run many codegen units in parallel, so cgu=1
# gives up that parallelism for a gain Bevy's own page calls marginal.
#
# `panic` stays `unwind` on purpose: Bevy's task pools and error handler rely on
# unwinding. `strip = "debuginfo"` is explicit rather than left to the default because
# linking this client with debuginfo has SIGBUSed a hosted GitHub runner before
# (docs/planning/audit/sources/audit-build-test-deps.md) — the guarantee is load-bearing,
# not cosmetic. It strips debuginfo only, not the symbol table, so a panic in a user's
# shipped build still backtraces with function names, just without line numbers.
[profile.release]
lto = "thin"
strip = "debuginfo"
