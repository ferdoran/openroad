[package]
name = "bevy_pk2"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reader for SRO PK2 (JMXPACK) archives, exposed as a Bevy AssetReader."
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byteorder = { workspace = true }
bevy = { workspace = true }
bytes = { workspace = true }
encoding = {version = "0.2"}
futures = { workspace = true }
# Reading the user-supplied archive key out of their local config.yaml
# (see src/pk2/key.rs); already in the workspace tree via `client`.
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
